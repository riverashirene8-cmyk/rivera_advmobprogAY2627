name: rivera_advmobprog
description: "A Flutter e-commerce application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5+1

  # HTTP/API
  http: ^1.5.0

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Environment Variables
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/images/